name: SEO Validation

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run SEO audit
        run: node scripts/seo-audit.mjs
